<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | DC-Chase</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Add your ad SDK script here (replace with actual URL) -->
    <script src="https://example.com/ad-sdk.js"></script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">DC-Chase</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var unityInstance; // Store the Unity instance globally

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/dealcart-chase-game.loader.js";
      var config = {
        dataUrl: buildUrl + "/dealcart-chase-game.data",
        frameworkUrl: buildUrl + "/dealcart-chase-game.framework.js",
        codeUrl: buildUrl + "/dealcart-chase-game.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "DC-Chase",
        productVersion: "2.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "1080px";
        canvas.style.height = "1920px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance; // Save the instance for later use
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      // JavaScript to handle messages from Unity
      window.handleUnityMessage = function(message) {
        console.log("Received message from Unity: " + message);

        if (message === 0) {
          hideAds(); // Hide all ads
        } else if (message === 1) {
          showBannerAd(); // Show banner ad
        } else if (message === 2) {
          showInterstitialAd(); // Show interstitial ad
        }
      };

      // Placeholder ad functions (replace with your ad SDK calls)
      function showBannerAd() {
        console.log("Showing Banner Ad");
        // Example: Replace with your ad SDK call
        // if (typeof AdMob !== 'undefined') {
        //     AdMob.showBanner({ position: 'top' });
        // }
      }

      function showInterstitialAd() {
        console.log("Showing Interstitial Ad");
        // Example: Replace with your ad SDK call
        // if (typeof AdMob !== 'undefined') {
        //     AdMob.showInterstitial();
        // }
        // Optional: Notify Unity when ad closes
        // unityInstance.SendMessage("AdManager", "OnInterstitialClosed");
      }

      function hideAds() {
        console.log("Hiding Ads");
        // Example: Replace with your ad SDK call
        // if (typeof AdMob !== 'undefined') {
        //     AdMob.hideBanner();
        // }
      }
    </script>
  </body>
</html>
